[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccfull-research-agent"
version = "0.2.0"
description = "Auditable tools and a conversational skill for Hagino CCFULL"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8,<4", "numpy>=1.26,<3"]

[project.scripts]
ccfull-agent = "ccfull_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ccfull_agent*"]
